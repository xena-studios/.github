name: Feature request
description: An idea for this project.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The problem, not the solution yet. Who runs into it, and how often?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you'd like it to work.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: Another tool, a workaround, or nothing.
